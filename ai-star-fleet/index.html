<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI 星际舰队</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* 布局：星图首页 → 单课“任务舱”。任务舱一次只展示一段（步骤条 + 计时器吸顶），题目一次一道。全站刻意单一深空主题。 */
:root {
  --void: #0B1028;
  --hull: #131A3F;
  --panel: #1A2352;
  --raise: #222D63;
  --line: #2E3A7A;
  --ink: #EEF1FF;
  --dim: #B3BBE6;
  --faint: #7C86BD;
  --amber: #FFB547;
  --cyan: #6FD3F7;
  --good: #63E29A;
  --bad: #FF8A80;
  --f-display: "ZCOOL QingKe HuangYou", "PingFang SC", "Microsoft YaHei", sans-serif;
  --f-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace;
  --r-lg: 22px; --r-md: 16px; --r-sm: 12px;
  --press: 0 4px 0 rgba(0, 0, 0, .35);
  /* Scratch 积木配色 */
  --bE: #FFBF00; --bM: #4C97FF; --bL: #9966FF; --bS: #CF63CF; --bC: #FFAB19;
  --bD: #5CB1D6; --bO: #59C059; --bX: #0FBD8C;
  --head-h: 64px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--void); color: var(--ink); }
body { font-family: var(--f-body); font-size: 17px; line-height: 1.75; min-height: 100vh; }
#stars { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--void); }
a { color: var(--cyan); }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 3px; border-radius: 8px; }
h1, h2, h3 { text-wrap: balance; line-height: 1.25; margin: 0; font-weight: 400; }
p { margin: 0; }
.wrap { position: relative; z-index: 1; max-width: 1040px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.narrow { max-width: 760px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- 按钮（圆润、按压感） ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 20px; border-radius: 999px;
  background: var(--raise); border: 2px solid var(--line); font-weight: 500; text-decoration: none; color: var(--ink);
  box-shadow: var(--press); transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease; }
.btn:hover { border-color: var(--cyan); }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0, 0, 0, .35); }
.btn.primary { background: var(--amber); border-color: var(--amber); color: #2A1A00; font-weight: 700; }
.btn.ghost { background: transparent; box-shadow: none; }
.btn svg { width: 18px; height: 18px; flex: none; }
.iconbtn { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: var(--raise); border: 2px solid var(--line); box-shadow: var(--press); transition: transform .15s ease; }
.iconbtn:active { transform: translateY(3px); box-shadow: none; }
.iconbtn svg { width: 20px; height: 20px; }

/* ---------- 顶栏 ---------- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--void) 85%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.topbar .wrap { display: flex; align-items: center; gap: 12px; height: var(--head-h); }
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); flex: none; }
.logo b { font-family: var(--f-display); font-weight: 400; font-size: 24px; letter-spacing: .04em; white-space: nowrap; }
.nav { display: flex; gap: 2px; margin-left: auto; }
.nav a { display: flex; align-items: center; min-height: 44px; text-decoration: none; color: var(--dim); padding: 0 14px; border-radius: 999px; font-size: 15px; white-space: nowrap; }
.nav a:hover { color: var(--ink); }
.nav a[aria-current="page"] { color: #2A1A00; background: var(--amber); font-weight: 700; }
.medalpill { display: flex; align-items: center; gap: 6px; font-family: var(--f-mono); font-size: 14px; color: var(--amber); border: 2px solid var(--line); border-radius: 999px; padding: 6px 12px; white-space: nowrap; }
.medalpill svg { width: 16px; height: 16px; }

main { padding-block: 28px 96px; }
.eyebrow { font-family: var(--f-mono); font-size: 13px; letter-spacing: .14em; color: var(--cyan); }

/* ---------- 首页 ---------- */
.hero { display: grid; gap: 16px; padding-block: 8px 4px; }
.hero h1 { font-family: var(--f-display); font-size: clamp(36px, 6.4vw, 64px); letter-spacing: .02em; }
.hero h1 em { font-style: normal; color: var(--amber); }
.hero p { max-width: 46ch; color: var(--dim); font-size: 18px; }
.hero .cta { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 4px; }
.progress-dots { display: flex; gap: 6px; align-items: center; margin-top: 6px; color: var(--faint); font-size: 14px; flex-wrap: wrap; }
.progress-dots i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); }
.progress-dots i.on { background: var(--amber); border-color: var(--amber); box-shadow: 0 0 10px var(--amber); }

.map { position: relative; aspect-ratio: 1000 / 600; margin-top: 30px; border: 2px solid var(--line); border-radius: 28px;
  background: radial-gradient(ellipse at 20% 10%, #2B1F6066, transparent 55%), radial-gradient(ellipse at 85% 90%, #0E4A6466, transparent 55%), color-mix(in srgb, var(--hull) 55%, transparent); overflow: hidden; }
.map svg.route { position: absolute; inset: 0; width: 100%; height: 100%; }
.map svg.route path { fill: none; stroke: var(--line); stroke-width: 2.5; stroke-dasharray: 2 10; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.pl { position: absolute; transform: translate(-50%, -50%); display: grid; justify-items: center; gap: 6px; text-decoration: none; color: var(--ink); width: 120px; text-align: center; border-radius: 18px; padding: 6px; }
.orb { --c: var(--amber); width: 64px; height: 64px; border-radius: 50%; position: relative; flex: none;
  background: radial-gradient(circle at 32% 30%, color-mix(in srgb, white 70%, var(--c)) 0, var(--c) 32%, color-mix(in srgb, var(--c) 35%, #050716) 100%);
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--c) 40%, transparent), 0 0 26px color-mix(in srgb, var(--c) 35%, transparent);
  transition: transform .3s cubic-bezier(.34, 1.56, .64, 1); display: grid; place-items: center; font-family: var(--f-mono); font-weight: 700; color: #0A0E22; font-size: 18px; }
.orb.ring::after { content: ""; position: absolute; left: -14px; right: -14px; top: 42%; height: 12px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--c) 70%, white); transform: rotate(-14deg); pointer-events: none; }
.pl:hover .orb, .pl:focus-visible .orb { transform: scale(1.12) rotate(-6deg); }
.pl .nm { font-family: var(--f-display); font-size: 19px; line-height: 1.1; }
.pl .tt { font-size: 13px; color: var(--dim); line-height: 1.35; }
.pl.done .orb { box-shadow: 0 0 0 3px var(--amber), 0 0 34px color-mix(in srgb, var(--amber) 60%, transparent); }
.pl .star { position: absolute; top: -2px; right: 22px; width: 22px; height: 22px; display: none; }
.pl.done .star { display: block; }
.pl.next .orb::before { content: ""; position: absolute; inset: -9px; border-radius: 50%; border: 2px dashed var(--amber); animation: spin 8s linear infinite; }
.pl.final .orb { width: 82px; height: 82px; }
@keyframes spin { to { transform: rotate(360deg); } }

.howto { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 40px; }
.howto div { background: color-mix(in srgb, var(--hull) 88%, transparent); border: 2px solid var(--line); border-radius: var(--r-md); padding: 14px 16px; display: grid; gap: 4px; }
.howto b { font-size: 16px; display: flex; align-items: center; gap: 8px; }
.howto b i { width: 26px; height: 26px; border-radius: 8px; background: var(--sc); display: grid; place-items: center; font-style: normal; font-family: var(--f-mono); font-size: 13px; color: #0A0E22; }
.howto span { color: var(--dim); font-size: 14px; line-height: 1.5; }

details.fold { margin-top: 14px; border: 2px solid var(--line); border-radius: var(--r-md); background: color-mix(in srgb, var(--hull) 88%, transparent); }
details.fold > summary { list-style: none; cursor: pointer; min-height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 18px; font-weight: 500; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary .chev { margin-left: auto; transition: transform .2s ease; color: var(--faint); }
details.fold[open] > summary .chev { transform: rotate(90deg); }
details.fold > summary small { color: var(--faint); font-size: 14px; font-weight: 400; }
details.fold > .body { padding: 0 18px 18px; }
.tablebox { overflow-x: auto; border-radius: var(--r-sm); border: 1px solid var(--line); }
table { border-collapse: collapse; width: 100%; font-size: 14px; line-height: 1.55; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 500; color: var(--faint); font-size: 12px; letter-spacing: .06em; white-space: nowrap; background: var(--hull); }
tr:last-child td { border-bottom: 0; }
td.num { font-family: var(--f-mono); color: var(--faint); white-space: nowrap; }
td a { color: var(--ink); font-weight: 700; white-space: nowrap; text-decoration: none; }
td a:hover { color: var(--amber); }
.dotc { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--c); margin-right: 6px; }
.matrix td, .matrix th { text-align: center; padding: 8px 6px; }
.matrix td:first-child, .matrix th:first-child { text-align: left; white-space: nowrap; padding-left: 12px; }
.mdot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: var(--amber); }
.mdot.off { background: transparent; border: 1px dashed var(--line); width: 10px; height: 10px; }

/* ---------- 课程页 ---------- */
.crumbs { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.crumbs a.back { display: inline-flex; align-items: center; gap: 6px; color: var(--dim); text-decoration: none; min-height: 44px; }
.crumbs a.back:hover { color: var(--ink); }
.crumbs .pn { display: flex; gap: 8px; align-items: center; font-family: var(--f-mono); color: var(--faint); font-size: 14px; }
.lhead { display: flex; gap: 20px; align-items: center; margin-top: 8px; }
.lhead .orb { width: 92px; height: 92px; font-size: 26px; }
.lhead h1 { font-family: var(--f-display); font-size: clamp(30px, 5vw, 44px); }
.lhead .meta { color: var(--dim); font-size: 15px; margin-top: 4px; }

.xing { display: flex; gap: 14px; margin-top: 22px; align-items: flex-start; }
.avatar { width: 52px; height: 52px; border-radius: 16px; background: linear-gradient(140deg, var(--cyan), #3B5BFF); display: grid; place-items: center; flex: none; box-shadow: var(--press); }
.bubble { background: var(--panel); border: 2px solid var(--line); border-radius: 6px var(--r-lg) var(--r-lg) var(--r-lg); padding: 14px 18px; min-width: 0; flex: 1; }
.bubble .who { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-family: var(--f-mono); font-size: 13px; color: var(--cyan); margin-bottom: 4px; }
.speak { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px; border-radius: 999px; border: 2px solid var(--line); font-size: 13px; color: var(--dim); font-family: var(--f-body); }
.speak:hover { color: var(--ink); border-color: var(--cyan); }
.speak svg { width: 15px; height: 15px; }

/* 步骤条 + 计时器（吸顶） */
.dock { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--head-h)); z-index: 15; margin-top: 24px; padding-block: 10px;
  background: color-mix(in srgb, var(--void) 88%, transparent); backdrop-filter: blur(12px); }
.dock-in { display: flex; gap: 12px; align-items: center; background: var(--hull); border: 2px solid var(--line); border-radius: var(--r-lg); padding: 8px; }
.steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; flex: 1; min-width: 0; }
.step { min-height: 52px; border-radius: 14px; padding: 6px 10px; display: flex; align-items: center; gap: 10px; text-align: left; transition: background .2s ease; min-width: 0; }
.step:hover { background: var(--panel); }
.step .n { width: 30px; height: 30px; border-radius: 50%; flex: none; display: grid; place-items: center; font-family: var(--f-mono); font-size: 13px; font-weight: 700; border: 2px solid var(--sc); color: var(--sc); }
.step .t { min-width: 0; display: grid; line-height: 1.3; }
.step .t b { font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.step .t span { font-family: var(--f-mono); font-size: 12px; color: var(--faint); }
.step[aria-selected="true"] { background: color-mix(in srgb, var(--sc) 20%, var(--panel)); }
.step[aria-selected="true"] .n { background: var(--sc); color: #0A0E22; }
.step.seen:not([aria-selected="true"]) .n { background: color-mix(in srgb, var(--sc) 30%, transparent); }
.clockbox { display: flex; align-items: center; gap: 8px; padding-left: 10px; border-left: 2px solid var(--line); flex: none; }
.clock { font-family: var(--f-mono); font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 4.4ch; text-align: right; }
.clock.run { color: var(--cyan); }
.clock.over { color: var(--bad); }
.clockbox .iconbtn { width: 42px; height: 42px; }

.stage { margin-top: 18px; animation: rise .35s ease both; }
@keyframes rise { from { opacity: .001; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.stage-h { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.stage-h h2 { font-family: var(--f-display); font-size: clamp(26px, 4vw, 34px); }
.stage-h .pill { font-family: var(--f-mono); font-size: 13px; padding: 3px 12px; border-radius: 999px; background: var(--sc); color: #0A0E22; font-weight: 700; }
.stack-v { display: grid; gap: 16px; }
.lbl { font-family: var(--f-mono); font-size: 12px; letter-spacing: .14em; color: var(--faint); margin-bottom: 8px; display: block; }

.box { background: color-mix(in srgb, var(--hull) 92%, transparent); border: 2px solid var(--line); border-radius: var(--r-lg); padding: 20px 22px; min-width: 0; }
.trend { border-color: color-mix(in srgb, var(--amber) 55%, var(--line)); background: linear-gradient(120deg, color-mix(in srgb, var(--amber) 14%, var(--hull)), var(--hull) 70%); display: flex; gap: 14px; align-items: flex-start; }
.trend svg { width: 28px; height: 28px; flex: none; color: var(--amber); margin-top: 2px; }
.trend .lbl { color: var(--amber); margin-bottom: 2px; }

/* 小星对话：一句一句出现 */
.chat { display: grid; gap: 10px; }
.msg { display: flex; gap: 10px; align-items: flex-start; animation: rise .3s ease both; }
.msg .mini { width: 34px; height: 34px; border-radius: 10px; flex: none; background: linear-gradient(140deg, var(--cyan), #3B5BFF); display: grid; place-items: center; }
.msg p { background: var(--panel); border: 2px solid var(--line); border-radius: 4px 18px 18px 18px; padding: 10px 16px; max-width: 60ch; }
.chat-more { justify-self: start; margin-left: 44px; }

.caps { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.cap { background: var(--panel); border-radius: var(--r-md); padding: 14px 16px; font-size: 15px; line-height: 1.65; border-top: 4px solid var(--sc, var(--cyan)); }

/* 可打勾的步骤清单 */
.checks { display: grid; gap: 8px; counter-reset: c; list-style: none; padding: 0; margin: 0; }
.check { width: 100%; display: flex; gap: 12px; align-items: flex-start; text-align: left; background: var(--panel); border: 2px solid transparent; border-radius: var(--r-md); padding: 12px 14px; min-height: 52px; transition: border-color .15s ease, background .15s ease; }
.check:hover { border-color: var(--line); }
.check .box2 { width: 28px; height: 28px; border-radius: 9px; border: 2px solid var(--faint); flex: none; display: grid; place-items: center; font-family: var(--f-mono); font-size: 13px; color: var(--dim); margin-top: 1px; }
.check[aria-pressed="true"] { background: color-mix(in srgb, var(--good) 12%, var(--panel)); }
.check[aria-pressed="true"] .box2 { background: var(--good); border-color: var(--good); color: #0A0E22; }
.check[aria-pressed="true"] .txt { color: var(--dim); }
.checks .stagehead { font-family: var(--f-display); font-size: 20px; color: var(--sc, var(--good)); padding: 14px 4px 2px; display: flex; align-items: center; gap: 10px; }
.checks .stagehead:first-child { padding-top: 0; }
.checks .stagehead::after { content: ""; flex: 1; height: 2px; background: var(--line); border-radius: 2px; }
.meter { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; font-size: 14px; color: var(--dim); }
.meter .bar { flex: 1; height: 10px; border-radius: 999px; background: var(--panel); overflow: hidden; }
.meter .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--good), var(--cyan)); border-radius: 999px; transition: width .4s cubic-bezier(.34, 1.56, .64, 1); }

.know { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; counter-reset: k; }
.know li { counter-increment: k; display: grid; grid-template-columns: 34px 1fr; gap: 12px; background: var(--panel); border-radius: var(--r-md); padding: 14px 16px; }
.know li::before { content: counter(k); width: 30px; height: 30px; border-radius: 10px; background: var(--amber); color: #2A1A00; display: grid; place-items: center; font-family: var(--f-mono); font-weight: 700; font-size: 14px; }
.know b { color: var(--amber); font-weight: 700; }
.trap { border-color: color-mix(in srgb, var(--bad) 50%, var(--line)); background: color-mix(in srgb, var(--bad) 7%, var(--hull)); }
.trap .lbl { color: var(--bad); }
.trap ul { margin: 0; padding-left: 1.2em; display: grid; gap: 8px; }
.trap li::marker { color: var(--bad); }
.trap b { color: var(--ink); }
.tags { display: flex; flex-wrap: wrap; gap: 8px; }
.tag { font-size: 13px; border: 2px solid var(--line); border-radius: 999px; padding: 3px 12px; color: var(--dim); }
.tag b { color: var(--cyan); font-family: var(--f-mono); font-weight: 500; }
.teacher { font-size: 15px; color: var(--dim); display: grid; gap: 10px; }
.teacher a { font-weight: 700; }
.warn { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; background: color-mix(in srgb, var(--bad) 9%, var(--panel)); border-radius: var(--r-sm); padding: 10px 14px; color: var(--ink); }
.warn svg { width: 20px; height: 20px; flex: none; color: var(--bad); margin-top: 3px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.two > * { min-width: 0; }

/* 题目 */
.q { display: grid; gap: 14px; }
.q .qtext { font-size: 19px; font-weight: 500; line-height: 1.6; }
.q .kind { font-family: var(--f-mono); font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: var(--cyan); color: #0A0E22; margin-right: 8px; vertical-align: 2px; }
.q .kind.tf { background: var(--bC); }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opt { min-height: 54px; text-align: left; background: var(--panel); border: 2px solid var(--line); border-radius: var(--r-md); padding: 10px 14px; display: flex; gap: 12px; align-items: center; box-shadow: var(--press); transition: transform .12s ease, border-color .15s ease, background .15s ease; }
.opt i { font-style: normal; width: 30px; height: 30px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--raise); font-family: var(--f-mono); font-weight: 700; font-size: 14px; color: var(--dim); }
.opt:hover:not(:disabled) { border-color: var(--cyan); }
.opt:active:not(:disabled) { transform: translateY(3px); box-shadow: none; }
.opt.sel { border-color: var(--cyan); background: color-mix(in srgb, var(--cyan) 14%, var(--panel)); }
.opt.sel i { background: var(--cyan); color: #0A0E22; }
.opt.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 15%, var(--panel)); }
.opt.right i { background: var(--good); color: #0A0E22; }
.opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 13%, var(--panel)); animation: shake .35s ease; }
.opt.wrong i { background: var(--bad); color: #0A0E22; }
.opt:disabled { cursor: default; box-shadow: none; }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.fb { display: flex; gap: 12px; align-items: flex-start; border-radius: var(--r-md); padding: 12px 16px; background: var(--panel); font-size: 15px; animation: rise .3s ease both; }
.fb .mini { width: 34px; height: 34px; border-radius: 10px; flex: none; background: linear-gradient(140deg, var(--cyan), #3B5BFF); display: grid; place-items: center; }
.fb b { display: block; font-size: 16px; }

};

// ---------- 工具 ----------
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const pad = n => String(n).padStart(2, "0");
const pick = a => a[Math.floor(Math.random() * a.length)];
const ABC = "ABCD";
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
function store(key, val) {
  try {
    if (val === undefined) return JSON.parse(localStorage.getItem(key) || "null");
    localStorage.setItem(key, JSON.stringify(val));
  } catch (e) { return null; }
}
let badges = new Set(store("fleet-badges") || []);

const nextLesson = () => (L.find(l => !badges.has(l.id)) || L[L.length - 1]);

function burst(el, n = 18) {
  if (still || !el) return;
  const r = el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const colors = ["#FFB547", "#6FD3F7", "#63E29A", "#B79CFF", "#F78FB3"];
  for (let i = 0; i < n; i++) {
    const s = document.createElement("span");
    s.className = "spark";
    const a = Math.random() * Math.PI * 2, d = 50 + Math.random() * 90;
    s.style.cssText = `left:${cx}px;top:${cy}px;background:${pick(colors)};--dx:${Math.cos(a) * d}px;--dy:${Math.sin(a) * d - 30}px`;

  }
}

// 积木脚本渲染：每行 "类别|文字"，两空格一层嵌套，"---" 分隔脚本
function blockText(t) {
  let h = esc(t);
  h = h.replace(/&lt;(.+)&gt;(?= 那么|$)/, '<span class="hex">$1</span>');
  h = h.replace(/\(([^()]+)\)/g, '<span class="rep">$1</span>');
  return h;
}
function renderScripts(src) {
  if (!src) return "";
  // "@角色名" 行开始一个新角色，之后的脚本都归到这个角色下
  const groups = [];
  src.split(/\n---\n/).forEach(script => {
    const lines = script.split("\n");
    if (lines[0].startsWith("@")) groups.push({ name: lines.shift().slice(1), scripts: [] });
    else if (!groups.length) groups.push({ name: "", scripts: [] });
    groups[groups.length - 1].scripts.push(lines);
  });
  const stackHTML = lines => {
    const root = { kids: [] }, stack = [{ depth: -1, node: root }];
    lines.forEach(raw => {
      const depth = (raw.match(/^ */)[0].length) / 2;
      const [cat, ...rest] = raw.trim().split("|");
      const node = { cat, text: rest.join("|"), kids: [] };
      while (stack[stack.length - 1].depth >= depth) stack.pop();
      stack[stack.length - 1].node.kids.push(node);
      stack.push({ depth, node });
    });
    const draw = n => n.kids.length
      ? `<div class="cwrap" style="--b:var(--b${n.cat})"><div class="blk ${n.cat}">${blockText(n.text)}</div><div class="inner">${n.kids.map(draw).join("")}</div><div class="cap"></div></div>`
      : `<div class="blk ${n.cat}">${blockText(n.text)}</div>`;
    return `<div class="stack">${root.kids.map(draw).join("")}</div>`;
  };
  const body = groups.map(g => g.name
    ? `<div class="sprite"><span class="sname">${esc(g.name)}</span><div class="scripts">${g.scripts.map(stackHTML).join("")}</div></div>`
    : `<div class="scripts">${g.scripts.map(stackHTML).join("")}</div>`).join("");
  return `<div class="legend"><span style="--b:var(--bE)">事件</span><span style="--b:var(--bM)">运动</span><span style="--b:var(--bL)">外观</span><span style="--b:var(--bS)">声音</span><span style="--b:var(--bC)">控制</span><span style="--b:var(--bD)">侦测</span><span style="--b:var(--bO)">运算</span><span style="--b:var(--bX)">扩展</span></div>${body}`;
}

// 编程大题：题目 + 准备工作 + 功能实现，答案（思路、参考程序、评分）默认收起

      <div><span class="lbl">解题思路</span><ol class="know">${c.explain.map(t => `<li><span>${t}</span></li>`).join("")}</ol></div>
      <div><span class="lbl">参考程序</span>${renderScripts(c.code)}</div>
      <div><span class="lbl">评分标准 · 共 25 分</span><ul class="score-list">${c.score.map(s => `<li>${s}</li>`).join("")}</ul></div>
    </div></details>`;
}

// ---------- 题目 ----------
function norm(item) {
  const isTF = item.t === "tf" || typeof item.ans === "boolean";
  return { isTF, q: item.q, exp: item.exp, choices: isTF ? ["正确", "错误"] : item.opts, ans: isTF ? (item.ans ? 0 : 1) : item.ans };
}
function qHTML(item, opts = {}) {
  const n = norm(item);
  return `<div class="q" data-ans="${n.ans}">
    <div class="qtext">${opts.kind !== false ? `<span class="kind ${n.isTF ? "tf" : ""}">${n.isTF ? "判断" : "单选"}${opts.num ? " " + opts.num : ""}</span>` : ""}${n.q}</div>
    <div class="opts" role="group" aria-label="选项">${n.choices.map((c, i) => `<button class="opt" data-i="${i}"><i>${n.isTF ? (i ? "✗" : "✓") : ABC[i]}</i><span>${c}</span></button>`).join("")}</div>
    <div class="fbslot" aria-live="polite"></div>
  </div>`;
}
// 即时判题：标出对错，显示小星反馈
function judge(q, chosen, exp) {
  const ans = +q.dataset.ans, ok = chosen === ans;
  q.querySelectorAll(".opt").forEach((b, i) => {
    b.disabled = true; b.classList.remove("sel");
    if (i === ans) b.classList.add("right"); else if (i === chosen) b.classList.add("wrong");
  });
  const right = q.querySelectorAll(".opt")[ans].querySelector("span").textContent;
  q.querySelector(".fbslot").innerHTML = `<div class="fb ${ok ? "ok" : "no"}"><span class="mini">${I.bot}</span><div><b>${chosen == null ? "这题没有作答" : ok ? pick(PRAISE) : pick(COMFORT)}</b>${ok ? "" : `正确答案：${right}。`}${exp}</div></div>`;
  if (ok) burst(q.querySelectorAll(".opt")[ans], 14);
  return ok;
}

let timer = { left: 0, run: false, id: null };
let cur = { l: null, step: 0, seen: new Set() };

function viewLesson(id) {
  const l = L.find(x => x.id === id);
  if (!l) return viewMap();
  const sched = l.schedule || DEFAULT_SCHED;
  const total = sched.reduce((n, s) => n + s.min, 0);
  const prev = L.find(x => x.id === id - 1), next = L.find(x => x.id === id + 1);
  cur = { l, sched, step: 0, seen: new Set([0]) };
  app.innerHTML = `
    <div class="narrow" style="margin:0 auto">
    <div class="crumbs"><a class="back" href="#map">${I.arrowL.replace('aria-hidden="true"', 'aria-hidden="true" width="18" height="18"')}星图</a>
      <span class="pn">${prev ? `<a class="iconbtn" href="#p${prev.id}" aria-label="上一课：${prev.planet}">${I.arrowL}</a>` : ""}${pad(l.id)} / 12${next ? `<a class="iconbtn" href="#p${next.id}" aria-label="下一课：${next.planet}">${I.arrowR}</a>` : ""}</span></div>
    <div class="lhead">

    </div>
    <div class="xing">
      <span class="avatar">${I.bot.replace(/22/g, "30")}</span>
      <div class="bubble"><div class="who"><span>小星</span><button class="speak" id="speak">${I.speak}读给我听</button></div><p>${l.story}</p></div>
    </div>
    </div>
    <div class="dock narrow" style="margin-left:auto;margin-right:auto">
      <div class="dock-in">
        <div class="steps" role="tablist" aria-label="课堂环节">${sched.map((s, i) => `<button class="step" role="tab" id="tab${i}" aria-controls="stage" data-i="${i}" style="--sc:${SEG_COLOR[s.key]}"><span class="n">${i + 1}</span><span class="t"><b>${s.label}</b><span>${s.min} 分钟</span></span></button>`).join("")}</div>
        <div class="clockbox"><span class="clock" id="clock" aria-label="本环节剩余时间">00:00</span>

          <button class="iconbtn" id="treset" aria-label="重置计时">${I.reset}</button></div>
      </div>
    </div>
    <div class="narrow" style="margin:0 auto"><section id="stage" role="tabpanel"></section></div>`;

  document.querySelectorAll(".step").forEach(b => b.addEventListener("click", () => goStep(+b.dataset.i, true)));
  document.getElementById("tplay").addEventListener("click", toggleTimer);
  document.getElementById("treset").addEventListener("click", () => { stopTimer(); setClock(); });
  document.getElementById("speak").addEventListener("click", () => {
    try {
      const u = new SpeechSynthesisUtterance(l.story);
      u.lang = "zh-CN"; u.rate = 1.05; u.pitch = 1.2;
      speechSynthesis.cancel(); speechSynthesis.speak(u);
    } catch (e) { document.getElementById("speak").textContent = "此浏览器不支持朗读"; }
  });
  goStep(0, false);
}

function setClock() {
  timer.left = cur.sched[cur.step].min * 60;
  drawClock();
}
function drawClock() {
  const c = document.getElementById("clock"); if (!c) return;
  const a = Math.abs(timer.left);
  c.textContent = `${timer.left < 0 ? "+" : ""}${pad(Math.floor(a / 60))}:${pad(a % 60)}`;
  c.classList.toggle("over", timer.left < 0);
  c.classList.toggle("run", timer.run && timer.left >= 0);
}
function toggleTimer() {
  const b = document.getElementById("tplay");
  if (timer.run) { stopTimer(); return; }
  timer.run = true; b.innerHTML = I.pause; b.setAttribute("aria-label", "暂停计时");
  timer.id = setInterval(() => { timer.left--; drawClock(); }, 1000);
  drawClock();
}
function stopTimer() {
  timer.run = false; clearInterval(timer.id);
  const b = document.getElementById("tplay");
  if (b) { b.innerHTML = I.play; b.setAttribute("aria-label", "开始计时"); }
  drawClock();
}

function goStep(i, scroll) {
  const { l, sched } = cur;
  stopTimer();
  cur.step = i; cur.seen.add(i);
  setClock();
  document.querySelectorAll(".step").forEach((b, j) => {
    b.setAttribute("aria-selected", j === i); b.tabIndex = j === i ? 0 : -1;
    b.classList.toggle("seen", cur.seen.has(j));
  });
  const s = sched[i];
  const stage = document.getElementById("stage");
  stage.setAttribute("aria-labelledby", "tab" + i);
  stage.style.setProperty("--sc", SEG_COLOR[s.key]);
  const last = i === sched.length - 1;
  stage.innerHTML = `<div class="stage">
      <div class="stage-h"><span class="pill">${i + 1} / ${sched.length}</span><h2>${s.key === "ai" ? l.ai.title : s.key === "project" ? l.project.name : s.label}</h2></div>
      ${RENDER[s.key](l)}
      ${last ? finishHTML(l) : `<div class="stage-foot">${i ? `<button class="btn ghost" id="prevstep">${I.arrowL}${sched[i - 1].label}</button>` : "<span></span>"}<button class="btn primary" id="nextstep">下一步：${sched[i + 1].label}${I.arrowR}</button></div>`}
    </div>`;
  BIND[s.key] && BIND[s.key](stage, l);
  const nb = document.getElementById("nextstep"), pb = document.getElementById("prevstep");
  nb && nb.addEventListener("click", () => goStep(i + 1, true));
  pb && pb.addEventListener("click", () => goStep(i - 1, true));
  if (last) bindFinish(l);
  if (scroll) {
    const dock = document.querySelector(".dock");
    const y = dock.getBoundingClientRect().top + scrollY - document.getElementById("topbar").offsetHeight - 4;
    if (scrollY > y) window.scrollTo({ top: y, behavior: still ? "auto" : "smooth" });
  }
}

function finishHTML(l) {
  const got = badges.has(l.id), nx = L.find(x => x.id === l.id + 1);
  return `<div class="finish ${got ? "got" : ""}" id="finish">
    <span class="medal">${pad(l.id)}</span>
    <h3>${got ? `${l.badge} 已点亮` : `点亮「${l.badge}」`}</h3>
    <p>${got ? "这颗星球已经通关，继续向下一颗出发吧。" : "完成了闯关项目和练习？点亮这颗星球的徽章。"}</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
      <button class="btn ${got ? "ghost" : "primary"}" id="badgebtn">${got ? "取消点亮" : "点亮徽章"}</button>
      ${nx ? `<a class="btn ${got ? "primary" : ""}" href="#p${nx.id}">下一颗：${nx.planet}${I.arrowR}</a>` : `<a class="btn ${got ? "primary" : ""}" href="#exam">去模拟考${I.arrowR}</a>`}
    </div></div>`;
}
function bindFinish(l) {
  document.getElementById("badgebtn").addEventListener("click", () => {
    const had = badges.has(l.id);

  });
}

// 以 "#" 开头的条目是关卡标题，其余是可打勾的步骤
function checksHTML(items, key, meter) {
  const total = items.filter(t => !t.startsWith("#")).length;
  let n = 0;
  return `${meter ? `<div class="meter"><span class="bar"><i></i></span><span class="cnt">0 / ${total}</span></div>` : ""}
    <ol class="checks">${items.map(t => t.startsWith("#")
      ? `<li class="stagehead">${t.slice(1)}</li>`
      : `<li><button class="check" aria-pressed="false" data-n="${++n}"><span class="box2">${n}</span><span class="txt">${t}</span></button></li>`).join("")}</ol>`;
}
function bindChecks(stage) {
  stage.querySelectorAll(".checks").forEach(list => {
    const box = list.parentElement, btns = [...list.querySelectorAll(".check")];
    const upd = () => {
      const n = btns.filter(b => b.getAttribute("aria-pressed") === "true").length;
      const m = box.querySelector(".meter");
      if (m) { m.querySelector("i").style.width = (n / btns.length * 100) + "%"; m.querySelector(".cnt").textContent = n === btns.length ? "全部完成！" : `${n} / ${btns.length}`; }
      return n;
    };
    btns.forEach((b, i) => b.addEventListener("click", () => {
      const on = b.getAttribute("aria-pressed") !== "true";
      b.setAttribute("aria-pressed", on);
      b.querySelector(".box2").textContent = on ? "✓" : b.dataset.n;
      if (upd() === btns.length && on) burst(box.querySelector(".meter") || b, 24);
    }));
  });
}
function bindPoll(stage, poll) {
  stage.querySelectorAll(".q").forEach(q => q.addEventListener("click", e => {
    const b = e.target.closest(".opt"); if (!b || b.disabled) return;
    judge(q, +b.dataset.i, poll.exp);
  }));
}
// 小星的话一句一句出现
function bindChat(lines) {
  const box = document.getElementById("chat");
  let n = 0;
  const add = () => {
    const m = document.createElement("div");
    m.className = "msg"; m.innerHTML = `<span class="mini">${I.bot}</span><p>${lines[n++]}</p>`;
    box.insertBefore(m, box.querySelector(".chat-more"));
    if (n >= lines.length) box.querySelector(".chat-more")?.remove();
  };
  const more = document.createElement("button");
  more.className = "btn chat-more"; more.innerHTML = `小星，继续说${I.arrowR}`;
  more.addEventListener("click", add);
  box.appendChild(more);
  add();
}

// 考场演练：一次一道题
function runQuiz(l) {
  const box = document.getElementById("runner");
  const qs = l.quiz, res = [];
  let k = 0;
  const top = () => `<div class="runner-top"><span class="lbl" style="margin:0">考场演练</span><div class="qdots" aria-hidden="true">${qs.map((_, j) => `<i class="${res[j] === true ? "ok" : res[j] === false ? "no" : j === k ? "cur" : ""}"></i>`).join("")}</div><span class="score">第 ${Math.min(k + 1, qs.length)} / ${qs.length} 题</span></div>`;
  const show = () => {
    if (k >= qs.length) {
      const ok = res.filter(Boolean).length;
      box.innerHTML = `${top()}<div class="result"><div class="stars">${qs.map((_, j) => res[j] ? I.star : I.starOff).join("")}</div><div class="big">${ok} / ${qs.length}</div>
        <p style="color:var(--dim)">${ok === qs.length ? "全部答对！你已经掌握这颗星球的考点。" : ok >= 3 ? "不错！把答错的题再看一遍解析。" : "再复习一下核心考点，然后重来一次。"}</p>
        <button class="btn" id="redo">${I.reset}再练一遍</button></div>`;
      if (ok === qs.length) burst(box.querySelector(".big"), 30);
      document.getElementById("redo").addEventListener("click", () => { res.length = 0; k = 0; show(); });
      return;
    }
    const item = qs[k];
    box.innerHTML = `${top()}${qHTML(item, { num: "" })}<div class="runner-nav" style="margin-top:14px"></div>`;
    const q = box.querySelector(".q");
    q.addEventListener("click", e => {
      const b = e.target.closest(".opt"); if (!b || b.disabled) return;
      res[k] = judge(q, +b.dataset.i, item.exp);
      box.querySelector(".qdots").outerHTML = top().match(/<div class="qdots".*?<\/div>/)[0];
      const nav = box.querySelector(".runner-nav");
      nav.innerHTML = `<button class="btn primary">${k === qs.length - 1 ? "看成绩" : "下一题"}${I.arrowR}</button>`;
      nav.querySelector("button").addEventListener("click", () => { k++; show(); });
      nav.querySelector("button").focus({ preventScroll: true });
    });
  };
  show();
}

    <div class="examdock narrow" style="margin-left:auto;margin-right:auto"><div class="dock-in">
      <div class="meter"><span class="bar"><i id="ebar"></i></span><span id="ecnt">已答 0 / 15</span></div>
      <button class="btn primary" id="submit">交卷判分</button></div></div>
    <div class="narrow" style="margin:0 auto">
    <h2 class="examsec">一、单选题 <small>10 题 · 每题 3 分</small></h2>
    <div class="stack-v">${EXAM.single.map((q, i) => `<div class="qcard">${qHTML(q, { num: i + 1 })}</div>`).join("")}</div>
    <h2 class="examsec">二、判断题 <small>5 题 · 每题 4 分</small></h2>

    <h2 class="examsec">三、编程题 <small>2 题 · 每题 25 分</small></h2>
    <div class="stack-v">${EXAM.coding.map((c, i) => `<div class="box">${codingHTML(c, `编程 ${i + 1} · 25 分`)}
      <div class="selfscore"><label for="self${i}">自评得分</label><input id="self${i}" type="number" inputmode="numeric" min="0" max="25" value="0"><span>/ 25</span></div></div>`).join("")}</div>
    <div class="box" style="margin-top:24px" id="totalbox"><div class="total"><span class="lbl" style="margin:0">总分</span><span class="big" id="total">--</span><span style="color:var(--dim);font-size:15px" id="totalnote">先交卷，再填写编程题自评</span></div></div>
    </div>`;
  const cards = [...app.querySelectorAll(".qcard")];
  let obj = null;
  const count = () => {
    const n = cards.filter(c => c.classList.contains("done")).length;
    document.getElementById("ebar").style.width = (n / 15 * 100) + "%";
    document.getElementById("ecnt").textContent = `已答 ${n} / 15`;

    b.classList.add("sel"); c.dataset.chosen = b.dataset.i; c.classList.add("done");
    count();
  }));
  const calc = () => {
    const s = [0, 1].reduce((n, i) => n + Math.min(25, Math.max(0, +document.getElementById("self" + i).value || 0)), 0);
    if (obj == null) return;
    const t = obj + s;
    document.getElementById("total").textContent = t;
    document.getElementById("totalnote").textContent = `客观题 ${obj} / 50 · 编程题 ${s} / 50 · ${t >= 60 ? "达到 60 分通过线" : "还差 " + (60 - t) + " 分到 60 分"}（以官方通知为准）`;
  };
  document.getElementById("submit").addEventListener("click", e => {
    const left = 15 - cards.filter(c => c.classList.contains("done")).length;
    const btn = e.currentTarget;
    if (left && btn.dataset.confirm !== "1") { btn.dataset.confirm = "1"; btn.textContent = `还有 ${left} 题没答，仍要交卷`; return; }
    obj = 0;
    cards.forEach((c, i) => {
      const q = c.querySelector(".q"), chosen = c.dataset.chosen == null ? null : +c.dataset.chosen;
      if (judge(q, chosen, all[i].exp)) obj += i < 10 ? 3 : 4;
    });
    btn.disabled = true; btn.textContent = `客观题 ${obj} / 50`;
    calc();
    burst(btn, 24);
  });
  app.querySelectorAll(".selfscore input").forEach(inp => inp.addEventListener("input", calc));
}

// ---------- 路由 ----------
function route() {
  stopTimer();
  try { speechSynthesis.cancel(); } catch (e) {}
  const h = location.hash.slice(1);
  const m = h.match(/^p(\d+)$/);
  const page = m ? "lesson" : (h === "exam" || h === "guide") ? h : "map";
  document.querySelectorAll("[data-nav]").forEach(a => {
    if (a.dataset.nav === page) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
  if (m) viewLesson(+m[1]); else if (page === "exam") viewExam(); else if (page === "guide") viewGuide(); else viewMap();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
// 步骤条支持方向键切换
document.addEventListener("keydown", e => {
  const t = e.target.closest && e.target.closest(".step");
  if (!t || !["ArrowLeft", "ArrowRight"].includes(e.key)) return;
  const n = cur.sched.length, i = (cur.step + (e.key === "ArrowRight" ? 1 : n - 1)) % n;
  goStep(i, false); document.getElementById("tab" + i).focus();
});
drawPill();
route();

// ---------- 星空背景 ----------
(function stars() {
  const cv = document.getElementById("stars"), ctx = cv.getContext("2d");
  let pts = [];
  const size = () => {
    const d = devicePixelRatio || 1;
    cv.width = innerWidth * d; cv.height = innerHeight * d; ctx.setTransform(d, 0, 0, d, 0, 0);
    pts = Array.from({ length: Math.round(innerWidth * innerHeight / 6000) }, () => ({ x: Math.random() * innerWidth, y: Math.random() * innerHeight, r: Math.random() * 1.3 + .2, p: Math.random() * 6.28, s: Math.random() * .02 + .005 }));
  };
  const draw = () => {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (const s of pts) {
      s.p += still ? 0 : s.s;
      ctx.globalAlpha = .3 + .4 * (Math.sin(s.p) + 1) / 2;
      ctx.fillStyle = s.r > 1.2 ? "#FFE3A8" : "#CFD8FF";
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.28); ctx.fill();
    }
    if (!still) requestAnimationFrame(draw);
  };
  addEventListener("resize", () => { size(); if (still) draw(); });
  size(); draw();
})();
</script>
